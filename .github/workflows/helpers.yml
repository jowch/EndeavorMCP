# Builds endeavor for Linux, macOS and Windows (the helper Endeavor installs on
# servers, and the standalone binary) and publishes it to the "helpers" release
# as endeavor-<key>-<platform> (.exe on Windows), with endeavor-<key>.sha256;
# <key> is scripts/helpers.sh --key, a hash of the helper's source. Every build
# gets the key in ENDEAVOR_RELEASE_KEY, so `endeavor --version` can show it and
# `endeavor mcp` can fetch the Linux helper for a Mac or Windows computer.
# scripts/helpers.sh downloads the Linux ones, and scripts/install.sh and
# install.ps1 the newest build for a computer, from there. LATEST, uploaded
# after them, holds the newest key, for those scripts and for `endeavor update`.
# On main, once every platform has built, the pin job writes the key into
# scripts/release-key and the plugins' copies and pushes that to main, so the
# plugins run the build of main's own source and PRs never re-pin.
# Before publishing, builds nothing pins any more are pruned once the release
# holds more than 700 files (scripts/prune-helpers.sh), if the repository
# variable PRUNE_HELPERS_AUTO is true; prune-helpers.yml runs it by hand.
name: Helpers

on:
  push:
    branches: [main]
    paths:
      - crates/endeavor-mcp/**
      - crates/wire/**
      - plugin/**
      - runtime/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/helpers.yml
      - scripts/publish-helpers.sh
      - scripts/helpers.sh
  workflow_dispatch:

# One run at a time, in push order, so LATEST ends up naming the newest push.
concurrency:
  group: helpers
  cancel-in-progress: false

jobs:
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      # build.rs embeds runtime/ and plugin/ as checked in; Windows would check them out with CRLF, and the key covers LF.
      - name: Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - id: key
        shell: bash
        run: |
          set -e
          key=$(scripts/helpers.sh --key)
          if [ -z "$key" ]; then
            echo "scripts/helpers.sh --key printed no key." >&2
            exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: key
    runs-on: ${{ matrix.runner }}
    # A run takes a few minutes; a hung leg would otherwise hold every later release (the group doesn't cancel) for six hours.
    timeout-minutes: 45
    env:
      ENDEAVOR_RELEASE_KEY: ${{ needs.key.outputs.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            ext: ""
            can_run: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: ""
            can_run: true
          # Built on Apple Silicon, which can't be counted on to run it.
          - platform: darwin-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            ext: ""
            can_run: false
          - platform: darwin-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            ext: ""
            can_run: true
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            can_run: true
    steps:
      # build.rs embeds runtime/ and plugin/ as checked in; Windows would check them out with CRLF, and the key covers LF.
      - name: Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked -p endeavor-mcp --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/endeavor${{ matrix.ext }} out/
          file out/endeavor${{ matrix.ext }} || true
      # The build must carry the key its file is named by.
      - name: Check the key
        shell: bash
        run: |
          binary=out/endeavor${{ matrix.ext }}
          if [ -z "$ENDEAVOR_RELEASE_KEY" ]; then
            echo "The build has no release key." >&2
            exit 1
          fi
          if [ "${{ matrix.can_run }}" = true ]; then
            "$binary" --version
            got=$("$binary" --version | sed -n 's/^release //p' | tr -d '\r')
            if [ "$got" != "$ENDEAVOR_RELEASE_KEY" ]; then
              echo "$binary reports the release key '$got', not $ENDEAVOR_RELEASE_KEY." >&2
              exit 1
            fi
          elif ! grep -aqF "$ENDEAVOR_RELEASE_KEY" "$binary"; then
            echo "$binary doesn't contain the release key $ENDEAVOR_RELEASE_KEY." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/endeavor${{ matrix.ext }}
          if-no-files-found: error

  # Publishes the legs that built, as long as both Linux ones did (the app's
  # servers need them), and ends red if any leg failed.
  publish:
    needs: [key, build]
    if: ${{ !cancelled() && needs.key.result == 'success' }}
    runs-on: ubuntu-24.04
    # Also long enough for the pruning run (two blobless clones) that may come first.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # build.rs embeds runtime/ and plugin/ as checked in; Windows would check them out with CRLF, and the key covers LF.
      - name: Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      # GitHub allows 1000 files on a release and refuses uploads to a full
      # one. Once the release passes 700 files, builds nothing needs go; see
      # scripts/prune-helpers.sh. Off until the repository variable
      # PRUNE_HELPERS_AUTO is true (set it after a deleting run by hand has
      # been checked). A failure here doesn't hold the build back; it leaves
      # a warning on the run.
      - name: Prune
        if: ${{ vars.PRUNE_HELPERS_AUTO == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/prune-helpers.sh --delete --above 700 || echo "::warning::Pruning the Helpers release failed; see this step's log."
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.key.outputs.key }}
        run: sh scripts/publish-helpers.sh
      - name: Fail if a build failed
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "A build failed (the Linux builds were published, and so was any other that succeeded)." >&2
          exit 1

  # Points the plugins at this build: commits the key to scripts/release-key
  # and the plugins' launch/ copies on main. Only when every platform built,
  # because the plugins run on macOS and Windows too; otherwise the plugins
  # keep naming the last complete build. The commit touches no helper source,
  # so it doesn't start this workflow again, and a push made with the
  # workflow's own token doesn't start CI. It pins only a build of newer source
  # than the one pinned now (the commit its "Built from" line names), so a
  # re-run of an old run can't put an older build back; merges that land while
  # it builds don't stop it, since their own runs pin after it. A merge landing
  # between the fetch and the push makes the push fail; then it starts again.
  pin:
    needs: [key, build, publish]
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin the build
        env:
          KEY: ${{ needs.key.outputs.key }}
        shell: bash
        run: |
          set -e
          for try in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            # The source the current pin was built from: its "Built from"
            # line, or the commit that set it by hand.
            last=$(git log -1 --format=%H origin/main -- scripts/release-key)
            from=$(git log -1 --format=%B "$last" | sed -n 's/^Built from \([0-9a-f]\{40\}\)\.$/\1/p')
            [ -n "$from" ] || from=$last
            if git merge-base --is-ancestor "$GITHUB_SHA" "$from"; then
              echo "main already pins a build of $from, which isn't older than this run's $GITHUB_SHA; nothing to pin."
              exit 0
            fi
            printf '%s\n' "$KEY" > scripts/release-key
            sh scripts/plugins.sh sync
            if git diff --quiet; then
              echo "The plugins already name build $KEY."
              exit 0
            fi
            git commit -q -am "Plugins: pin build $KEY" -m "Built from $GITHUB_SHA."
            if git push -q origin main; then
              echo "Pinned build $KEY on main."
              exit 0
            fi
            sleep $((try * 5))
          done
          echo "Couldn't push the pin to main; run this workflow again on main." >&2
          exit 1
