name: Helpers

on:
  push:
    branches: [main]
    paths:
      - crates/endeavor-mcp/**
      - crates/wire/**
      - plugin/**
      - runtime/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/helpers.yml
      - scripts/publish-helpers.sh
      - scripts/helpers.sh
  workflow_dispatch:

concurrency:
  group: helpers
  cancel-in-progress: false

jobs:
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - id: key
        shell: bash
        run: |
          set -e
          key=$(scripts/helpers.sh --key)
          if [ -z "$key" ]; then
            echo "scripts/helpers.sh --key printed no key." >&2
            exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: key
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ENDEAVOR_RELEASE_KEY: ${{ needs.key.outputs.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            ext: ""
            can_run: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: ""
            can_run: true
          - platform: darwin-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            ext: ""
            can_run: false
          - platform: darwin-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            ext: ""
            can_run: true
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            can_run: true
    steps:
      - name: Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked -p endeavor-mcp --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/endeavor${{ matrix.ext }} out/
          file out/endeavor${{ matrix.ext }} || true
      - name: Check the key
        shell: bash
        run: |
          binary=out/endeavor${{ matrix.ext }}
          if [ -z "$ENDEAVOR_RELEASE_KEY" ]; then
            echo "The build has no release key." >&2
            exit 1
          fi
          if [ "${{ matrix.can_run }}" = true ]; then
            "$binary" --version
            got=$("$binary" --version | sed -n 's/^release //p' | tr -d '\r')
            if [ "$got" != "$ENDEAVOR_RELEASE_KEY" ]; then
              echo "$binary reports the release key '$got', not $ENDEAVOR_RELEASE_KEY." >&2
              exit 1
            fi
          elif ! grep -aqF "$ENDEAVOR_RELEASE_KEY" "$binary"; then
            echo "$binary doesn't contain the release key $ENDEAVOR_RELEASE_KEY." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/endeavor${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: [key, build]
    if: ${{ !cancelled() && needs.key.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sums: ${{ steps.publish.outputs.sums }}
    steps:
      - name: Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Prune
        if: ${{ vars.PRUNE_HELPERS_AUTO == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/prune-helpers.sh --delete --above 700 || echo "::warning::Pruning the Helpers release failed; see this step's log."
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.key.outputs.key }}
        run: sh scripts/publish-helpers.sh
      - name: Fail if a build failed
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "A build failed (the Linux builds were published, and so was any other that succeeded)." >&2
          exit 1

  pin:
    needs: [key, build, publish]
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin the build
        env:
          KEY: ${{ needs.key.outputs.key }}
          SUMS: ${{ needs.publish.outputs.sums }}
        shell: bash
        run: |
          set -e
          for name in linux-x86_64 linux-aarch64 darwin-x86_64 darwin-aarch64 windows-x86_64.exe; do
            if ! printf '%s\n' "$SUMS" | grep -Eq "^[0-9a-f]{64}  endeavor-$KEY-$name\$"; then
              echo "The published checksums have no line for endeavor-$KEY-$name, so nothing is pinned:" >&2
              printf '%s\n' "$SUMS" >&2
              exit 1
            fi
          done
          for try in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            last=$(git log -1 --format=%H origin/main -- scripts/release-key)
            from=$(git log -1 --format=%B "$last" | sed -n 's/^Built from \([0-9a-f]\{40\}\)\.$/\1/p')
            [ -n "$from" ] || from=$last
            if git merge-base --is-ancestor "$GITHUB_SHA" "$from"; then
              echo "main already pins a build of $from, which isn't older than this run's $GITHUB_SHA; nothing to pin."
              exit 0
            fi
            { printf '%s\n' "$KEY"; printf '%s\n' "$SUMS" | grep -E "^[0-9a-f]{64}  endeavor-$KEY-" | LC_ALL=C sort -k2; } > scripts/release-key
            sh scripts/plugins.sh sync
            if git diff --quiet; then
              echo "The plugins already name build $KEY."
              exit 0
            fi
            git commit -q -am "Plugins: pin build $KEY" -m "Built from $GITHUB_SHA."
            if git push -q origin main; then
              echo "Pinned build $KEY on main."
              exit 0
            fi
            sleep $((try * 5))
          done
          echo "Couldn't push the pin to main; run this workflow again on main." >&2
          exit 1
