name: Prune helpers

on:
  workflow_dispatch:
    inputs:
      delete:
        description: Delete the listed files (otherwise only list them)
        type: boolean
        default: false

concurrency:
  group: prune-helpers
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.delete }}" = true ]; then
            sh scripts/prune-helpers.sh --delete
          else
            sh scripts/prune-helpers.sh
          fi
