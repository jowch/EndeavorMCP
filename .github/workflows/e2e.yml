name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'runtime/**'
      - 'plugin/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'runtime/**'
      - 'plugin/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  julia:
    name: e2e julia
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Restore depots
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tmp/e2e-julia/depot
            target/tmp/e2e-serve/depot
          key: e2e-depots-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml') }}-${{ github.run_id }}
          restore-keys: e2e-depots-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml') }}-
      - name: Check depots
        id: depots
        run: |
          if [ -f target/tmp/e2e-julia/depot/.e2e-complete ] && [ -f target/tmp/e2e-serve/depot/.e2e-complete ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: cargo build --locked -p endeavor-mcp --tests
      - name: Test
        run: |
          set -o pipefail
          export ENDEAVOR_E2E_JULIA="$(command -v julia)"
          for test in e2e_julia e2e_serve; do
            cargo test --locked -p endeavor-mcp --test "$test" -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/$test.log"
            if grep -q 'SKIPPED:' "$RUNNER_TEMP/$test.log"; then
              echo "::error::$test was skipped"
              exit 1
            fi
          done
          touch target/tmp/e2e-julia/depot/.e2e-complete target/tmp/e2e-serve/depot/.e2e-complete
      - name: Save depots
        if: always() && steps.depots.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/tmp/e2e-julia/depot
            target/tmp/e2e-serve/depot
          key: e2e-depots-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml') }}-${{ github.run_id }}

  julia-newest:
    name: e2e julia on Julia ${{ matrix.julia }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia: ['1', 'pre']
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Build
        run: cargo build --locked -p endeavor-mcp --tests
      - name: Test
        run: |
          set -o pipefail
          export ENDEAVOR_E2E_JULIA="$(command -v julia)"
          julia --version
          for test in e2e_julia e2e_serve; do
            cargo test --locked -p endeavor-mcp --test "$test" -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/$test.log"
            if grep -q 'SKIPPED:' "$RUNNER_TEMP/$test.log"; then
              echo "::error::$test was skipped"
              exit 1
            fi
          done

  r:
    name: e2e r
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: R
        timeout-minutes: 10
        run: |
          apt="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          sudo apt-get $apt update
          sudo apt-get $apt install -y --no-install-recommends r-base-core r-base-dev r-cran-commonmark r-cran-httpuv r-cran-jsonlite r-cran-curl r-cran-later r-cran-processx r-cran-promises r-cran-renv
      - name: Restore depot and Ember
        id: restore-r
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tmp/e2e-r/depot
            ~/.cache/endeavor/r
          key: e2e-r-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml', 'runtime/r/install.R') }}-${{ github.run_id }}
          restore-keys: e2e-r-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml', 'runtime/r/install.R') }}-
      - name: Fresh Ember
        run: find ~/.cache/endeavor/r/ember -mindepth 1 -maxdepth 1 ! -name deps -exec rm -rf {} + 2>/dev/null || true
      - name: Check depot
        id: depot-r
        run: |
          if [ -f target/tmp/e2e-r/depot/.e2e-complete ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: cargo build --locked -p endeavor-mcp --tests
      - name: Test
        run: |
          set -o pipefail
          export ENDEAVOR_E2E_JULIA="$(command -v julia)"
          cargo test --locked -p endeavor-mcp --test e2e_r -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/e2e_r.log"
          if grep -q 'SKIPPED:' "$RUNNER_TEMP/e2e_r.log"; then
            echo "::error::e2e_r was skipped"
            exit 1
          fi
          mkdir -p target/tmp/e2e-r/depot
          touch target/tmp/e2e-r/depot/.e2e-complete
      - name: R adapter test
        run: |
          ember=~/.cache/endeavor/r/ember
          build=$(sed -n 's/^Current: //p' "$ember/ember.dcf")
          R_LIBS="$ember/$build:$ember/deps" Rscript runtime/r/test/test.R
      - name: Save depot and Ember
        if: success() && steps.depot-r.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/tmp/e2e-r/depot
            ~/.cache/endeavor/r
          key: e2e-r-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml', 'runtime/r/install.R') }}-${{ github.run_id }}

  marimo:
    name: e2e marimo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
      - name: Build
        run: cargo build --locked -p endeavor-mcp --tests
      - name: Test
        run: |
          set -o pipefail
          cargo test --locked -p endeavor-mcp --test e2e_marimo -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/e2e_marimo.log"
          if grep -q 'SKIPPED:' "$RUNNER_TEMP/e2e_marimo.log"; then
            echo "::error::e2e_marimo was skipped"
            exit 1
          fi

  marimo-windows:
    name: e2e marimo windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
      - name: Build
        run: cargo build --locked -p endeavor-mcp --tests
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p endeavor-mcp --test e2e_marimo_windows -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/e2e_marimo_windows.log"
          if grep -q 'SKIPPED:' "$RUNNER_TEMP/e2e_marimo_windows.log"; then
            echo "::error::e2e_marimo_windows was skipped"
            exit 1
          fi
