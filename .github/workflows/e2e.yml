# The tests against real Julia (e2e_julia, e2e_serve) and real Julia and R
# (e2e_r), which ci.yml skips because they are ignored by default. They take a
# few minutes once the packages are cached and much longer the first time, so
# they run in their own workflow: CI's checks don't wait for them. Linux only
# for now. They run on a
# PR or push that changes what goes into the binary (the crates, the runtime,
# the skills it embeds, the Cargo files), and on request (docs/testing.md).
# The R job also runs every day: R notebooks install Ember's latest build from
# r-universe, so a push to Ember's main reaches users at their next R start, and
# a change there that breaks the adapter should show up here first.
# Because of those path filters, don't make this check required in branch
# protection: a PR that changes none of them would wait for it forever.
name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'runtime/**'
      - 'plugin/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'runtime/**'
      - 'plugin/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  # A run on main finishes, so each merge gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  julia:
    name: e2e julia
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      # The version Endeavor downloads (JULIA_VERSION in crates/endeavor-mcp/src/julia.rs).
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      # Each test installs the runtime's packages into a depot of its own under
      # target/tmp. Keep those depots between runs, saved even when a test
      # fails, so the next run doesn't install everything again.
      - name: Restore depots
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tmp/e2e-julia/depot
            target/tmp/e2e-serve/depot
          key: e2e-depots-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml') }}-${{ github.run_id }}
          restore-keys: e2e-depots-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml') }}-
      # A run whose tests passed marks its depots complete. One restored without
      # the mark came from a failed run and may lack packages.
      - name: Check depots
        id: depots
        run: |
          if [ -f target/tmp/e2e-julia/depot/.e2e-complete ] && [ -f target/tmp/e2e-serve/depot/.e2e-complete ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: cargo build --locked -p endeavor-mcp --tests
      # A test that finds no Julia prints SKIPPED and passes. Here that would
      # hide a broken setup, so the step fails on it.
      - name: Test
        run: |
          set -o pipefail
          export ENDEAVOR_E2E_JULIA="$(command -v julia)"
          for test in e2e_julia e2e_serve; do
            cargo test --locked -p endeavor-mcp --test "$test" -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/$test.log"
            if grep -q 'SKIPPED:' "$RUNNER_TEMP/$test.log"; then
              echo "::error::$test was skipped"
              exit 1
            fi
          done
          touch target/tmp/e2e-julia/depot/.e2e-complete target/tmp/e2e-serve/depot/.e2e-complete
      # Save only when the restored depots weren't complete: a new entry each
      # time would fill the cache, and complete depots have nothing to add.
      - name: Save depots
        if: always() && steps.depots.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/tmp/e2e-julia/depot
            target/tmp/e2e-serve/depot
          key: e2e-depots-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml') }}-${{ github.run_id }}

  r:
    name: e2e r
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      # R and most of Ember's packages from Ubuntu's archive. The first R
      # notebook builds what's missing (RcppMsgPack) and Ember itself from
      # r-universe's source package, as it would for a user.
      - name: R
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev r-cran-commonmark r-cran-httpuv r-cran-jsonlite r-cran-later r-cran-processx r-cran-promises r-cran-renv
      # The Julia depot, and the folder Ember installs into (paths.rs ember_folder).
      # A build's library is only there when its install finished, so a restored
      # one is whole; the test updates it to Ember's latest build.
      - name: Restore depot and Ember
        id: restore-r
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tmp/e2e-r/depot
            ~/.cache/endeavor/r
          key: e2e-r-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml', 'runtime/r/install.R') }}-${{ github.run_id }}
          restore-keys: e2e-r-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml', 'runtime/r/install.R') }}-
      # The daily run installs Ember's latest build afresh (keeping the
      # packages it needs), so a build that doesn't install or load fails the
      # test instead of falling back to the cached one.
      - name: Fresh Ember on the daily run
        if: github.event_name == 'schedule'
        run: find ~/.cache/endeavor/r/ember -mindepth 1 -maxdepth 1 ! -name deps -exec rm -rf {} + 2>/dev/null || true
      # As for Julia's: a passing run marks what it restored or installed complete.
      - name: Check depot
        id: depot-r
        run: |
          if [ -f target/tmp/e2e-r/depot/.e2e-complete ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: cargo build --locked -p endeavor-mcp --tests
      - name: Test
        run: |
          set -o pipefail
          export ENDEAVOR_E2E_JULIA="$(command -v julia)"
          cargo test --locked -p endeavor-mcp --test e2e_r -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/e2e_r.log"
          if grep -q 'SKIPPED:' "$RUNNER_TEMP/e2e_r.log"; then
            echo "::error::e2e_r was skipped"
            exit 1
          fi
          # e2e_r starts no Julia, so nothing else makes the depot.
          mkdir -p target/tmp/e2e-r/depot
          touch target/tmp/e2e-r/depot/.e2e-complete
      # Only a passing run saves, so the Ember library saved is one that worked.
      - name: Save depot and Ember
        if: success() && steps.depot-r.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/tmp/e2e-r/depot
            ~/.cache/endeavor/r
          key: e2e-r-${{ runner.os }}-julia-1.12.6-${{ hashFiles('runtime/**/Project.toml', 'runtime/Manifest.toml', 'runtime/r/install.R') }}-${{ github.run_id }}
