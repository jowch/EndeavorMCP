name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - name: Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Plugin copies
        if: runner.os == 'Linux'
        run: sh scripts/plugins.sh check
      - name: Pinned build unchanged
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: |
          git fetch -q --deepen=1
          if ! git diff --quiet HEAD^1 HEAD -- scripts/release-key '*/launch/release-key'; then
            git diff --stat HEAD^1 HEAD -- scripts/release-key '*/launch/release-key'
            echo "::error::This PR changes the pinned build (release-key). Only the Helpers workflow sets it, on main. Take main's copy: git checkout origin/main -- scripts/release-key '*/launch/release-key'"
            exit 1
          fi
      - name: No socket copies outside tests
        if: runner.os == 'Linux'
        run: |
          rustup component add clippy
          cargo clippy --locked --workspace --lib --bins -- -A clippy::all -D clippy::disallowed_methods
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Notebook view's copy of Endeavor's view.js
        if: runner.os == 'Linux' && !cancelled()
        run: sh scripts/view-frontend.sh check

  julia:
    name: julia ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@v2
      - name: Test
        run: julia --project=runtime/EndeavorRuntime -e 'using Pkg; Pkg.test()'
