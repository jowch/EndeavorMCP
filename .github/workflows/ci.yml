# Builds the workspace and runs its tests on Linux, macOS and Windows. The
# tests against real Julia (e2e_julia, e2e_serve) are ignored by default and
# run in e2e.yml instead (docs/testing.md). Each job has a time limit well above a
# normal run (a few minutes), so a test that hangs fails the job instead of
# holding it, and the PR's checks, for GitHub's default of six hours.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      # Tests compare checked-in text byte for byte, so keep LF line endings.
      - name: Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Plugin copies
        if: runner.os == 'Linux'
        run: sh scripts/plugins.sh check
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      # Temporary, for EndeavorMCP #154's review: the Windows tests again and again, to show they're stable.
      - name: Windows tests, 25 times
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked -p endeavor-mcp --lib a_child_started -- --nocapture && for i in $(seq 25); do echo "run $i"; cargo test --locked -p endeavor-mcp --test windows -q || exit 1; done

  # The runtime package's own tests (runtime/EndeavorRuntime/test). The runtime
  # runs only on Linux and macOS servers, so there is no Windows job.
  julia:
    name: julia ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      # The version Endeavor downloads (JULIA_VERSION in crates/endeavor-mcp/src/julia.rs).
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@v2
      - name: Test
        run: julia --project=runtime/EndeavorRuntime -e 'using Pkg; Pkg.test()'
