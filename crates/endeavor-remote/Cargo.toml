[package]
name = "endeavor-remote"
version.workspace = true
edition = "2024"

[dependencies]
wire = { path = "../wire" }
serde_json = "1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The bridge token's random bytes (Unix reads /dev/urandom).
getrandom = "0.3"
# Paths as Julia's realpath gives them, without std's \\?\ prefix.
dunce = "1"
# The runtime's processes: a Job Object, and pids checked against start times.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
