[package]
name = "endeavor-mcp"
version.workspace = true
edition = "2024"

[[bin]]
name = "endeavor"
path = "src/main.rs"

[dependencies]
wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
getrandom = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
