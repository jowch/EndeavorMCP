[package]
name = "endeavor-mcp"
version.workspace = true
edition = "2024"

# The package can't be named `endeavor`: Endeavor's app package is, and it depends on this one.
[[bin]]
name = "endeavor"
path = "src/main.rs"

[dependencies]
wire = { path = "../wire" }
serde_json = "1"
libc = "0.2"
# The name of the cookie that lets a browser in, from the token.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# The bridge token's random bytes (Unix reads /dev/urandom).
getrandom = "0.3"
# The runtime's processes: a Job Object, and pids checked against start times.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
