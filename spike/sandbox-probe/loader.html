<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Notebook</title>
<style>#boot{font:13px system-ui,sans-serif;padding:12px}</style>
</head><body><div id="boot">Loading the notebook…</div>
<script type="module">
/*APPLIB*/
const { App } = window.McpAppLib;
const boot = document.getElementById("boot");
const say = t => { boot.textContent = t; };
const app = window.__endeavorApp = new App({ name: "Endeavor notebook", version: "0.0.1" }, { availableDisplayModes: ["inline", "fullscreen"] });
await app.connect();
const report = r => app.callServerTool({ name: "probe_report", arguments: { report: r } }).catch(() => {});
const t0 = performance.now();
try {
  // Pull the page in parts through our own server's tool: the view can't fetch 127.0.0.1, and a big ui:// resource doesn't render.
  let html = "", offset = 0, total = 1, size = 1000000, calls = 0, fails = 0;
  while (offset < total) {
    let res;
    try { res = await app.callServerTool({ name: "page_part", arguments: { offset, size } }); calls++; }
    catch (e) { fails++; if (size <= 50000 || fails > 6) throw e; size = Math.floor(size / 2); continue; }
    const sc = res.structuredContent;
    if (!sc || typeof sc.text !== "string") { fails++; if (size <= 50000 || fails > 6) throw new Error("no structuredContent"); size = Math.floor(size / 2); continue; }
    total = sc.total; html += sc.text; offset += sc.text.length;
    say(`Loading the notebook… ${Math.round(100 * offset / total)}%`);
  }
  const parts = calls + " calls, last size " + size + ", fails " + fails;
  const fetched = performance.now();
  const doc = new DOMParser().parseFromString(html, "text/html");
  // Pluto reads its storage at start; keep a page-local copy if the sandbox refuses it.
  for (const el of [...doc.head.children]) {
    if (el.tagName === "SCRIPT") continue;
    if (el.tagName === "META" && el.httpEquiv) continue;
    document.head.appendChild(document.importNode(el, true));
  }
  const scripts = [...doc.querySelectorAll("script")];
  for (const s of scripts) s.remove();
  boot.remove();
  for (const el of [...doc.body.childNodes]) document.body.appendChild(document.importNode(el, true));
  for (const s of scripts) {
    if (s.type === "importmap") continue;
    const n = document.createElement("script");
    for (const a of s.attributes) if (a.name !== "src" || !a.value.startsWith("data:")) n.setAttribute(a.name, a.value);
    n.textContent = s.textContent;
    document.body.appendChild(n);
  }
  setTimeout(() => {
    const c = document.querySelector("pluto-output canvas");
    report("loader " + JSON.stringify({
      bytes: html.length, parts, fetch_ms: Math.round(fetched - t0), total_ms: Math.round(performance.now() - t0),
      cells: document.querySelectorAll("pluto-cell").length,
      canvas: c ? Array.from(c.getContext("2d").getImageData(15, 20, 1, 1).data).join(",") : "none",
      editor: document.querySelector("pluto-editor")?.className,
    }));
  }, 8000);
} catch (e) {
  say("Couldn't load the notebook: " + (e && e.message || e));
  report("loader ERR " + (e && e.stack || e));
}
</script>
</body></html>
