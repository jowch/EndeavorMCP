<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Notebook</title>
<style>#boot{font:13px system-ui,sans-serif;padding:12px}</style>
</head><body><div id="boot">Loading the notebook…</div>
<script type="module">
/*APPLIB*/
const { App } = window.McpAppLib;
const boot = document.getElementById("boot");
const say = t => { boot.textContent = t; };
const app = window.__endeavorApp = new App({ name: "Endeavor notebook", version: "0.0.1" }, { availableDisplayModes: ["inline", "fullscreen"] });
await app.connect();
const report = r => app.callServerTool({ name: "probe_report", arguments: { report: r } }).catch(() => {});

// Pluto's page talks to Pluto over a WebSocket. The view can't reach 127.0.0.1, so
// this stand-in carries the same binary messages through our server's tools.
const stats = { sends: 0, recvs: 0, msgs_in: 0, recv_ms: [] };
window.__relayStats = stats;
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
class RelaySocket {
  static CONNECTING = 0; static OPEN = 1; static CLOSING = 2; static CLOSED = 3;
  constructor(url) {
    this.url = url; this.readyState = 0; this.binaryType = "blob"; this._chain = Promise.resolve();
    app.callServerTool({ name: "ws_open", arguments: {} }).then(res => {
      this.id = res.structuredContent.id; this.readyState = 1; this.onopen?.({ type: "open" }); this._loop();
    }).catch(e => { this.readyState = 3; this.onerror?.({ type: "error", error: e }); this.onclose?.({ type: "close" }); });
  }
  async _loop() {
    while (this.readyState === 1) {
      const t = performance.now();
      let res;
      try { res = await app.callServerTool({ name: "ws_recv", arguments: { id: this.id, wait_ms: 1500 } }); }
      catch (e) { await new Promise(r => setTimeout(r, 500)); continue; }
      stats.recvs++; stats.recv_ms.push(Math.round(performance.now() - t)); if (stats.recv_ms.length > 50) stats.recv_ms.shift();
      const sc = res.structuredContent || {};
      for (const m of sc.messages || []) { stats.msgs_in++; this.onmessage?.({ data: new Blob([unb64(m)]) }); }
      if (sc.closed) { this.readyState = 3; this.onclose?.({ type: "close" }); }
    }
  }
  send(data) {
    const u8 = data instanceof Uint8Array ? data : new Uint8Array(data);
    const payload = b64(u8);
    this._chain = this._chain.then(() => app.callServerTool({ name: "ws_send", arguments: { id: this.id, data: payload } })).then(() => { stats.sends++; });
  }
  close() { this.readyState = 3; }
}
window.WebSocket = RelaySocket;
// Pluto builds its socket address from this; the stand-in ignores it.
window.pluto_pluto_server_url = "https://pluto.invalid/";

const t0 = performance.now();
try {
  // Pull the page in parts through our own server's tool: the view can't fetch 127.0.0.1, and a big ui:// resource doesn't render.
  let html = "", offset = 0, total = 1, size = 1000000, calls = 0, fails = 0;
  while (offset < total) {
    let res;
    try { res = await app.callServerTool({ name: "page_part", arguments: { offset, size, page: "live.parts.json" } }); calls++; }
    catch (e) { fails++; if (size <= 50000 || fails > 6) throw e; size = Math.floor(size / 2); continue; }
    const sc = res.structuredContent;
    if (!sc || typeof sc.text !== "string") { fails++; if (size <= 50000 || fails > 6) throw new Error("no structuredContent"); size = Math.floor(size / 2); continue; }
    total = sc.total; html += sc.text; offset += sc.text.length;
    say(`Loading the notebook… ${Math.round(100 * offset / total)}%`);
  }
  const parts = calls + " calls, last size " + size + ", fails " + fails;
  const fetched = performance.now();
  const doc = JSON.parse(html);
  boot.remove();
  document.head.insertAdjacentHTML("beforeend", doc.head);
  document.body.insertAdjacentHTML("beforeend", doc.body);
  for (const s of doc.scripts) {
    if (s.attrs.type === "importmap") continue;
    const n = document.createElement("script");
    for (const [k, v] of Object.entries(s.attrs)) if (k !== "src") n.setAttribute(k, v ?? "");
    n.textContent = s.text;
    document.body.appendChild(n);
  }
  setTimeout(() => {
    const c = document.querySelector("pluto-output canvas");
    report("live " + JSON.stringify({ relay: stats,
      bytes: html.length, parts, fetch_ms: Math.round(fetched - t0), total_ms: Math.round(performance.now() - t0),
      cells: document.querySelectorAll("pluto-cell").length,
      canvas: c ? Array.from(c.getContext("2d").getImageData(15, 20, 1, 1).data).join(",") : "none",
      editor: document.querySelector("pluto-editor")?.className, outputs: [...document.querySelectorAll("pluto-output")].map(o => o.innerText.slice(0, 30)),
    }));
  }, 15000);
} catch (e) {
  say("Couldn't load the notebook: " + (e && e.message || e));
  report("loader ERR " + (e && e.stack || e));
}
</script>
</body></html>
