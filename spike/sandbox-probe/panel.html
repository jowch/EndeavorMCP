<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Panel probe</title>
<style>body{font:13px system-ui,sans-serif;padding:12px} pre{white-space:pre-wrap}</style></head>
<body><b>Panel probe: /*VARIANT*/</b> <button id="expand">Open in side panel</button><pre id="out">starting…</pre>
<script type="module">
/*APPLIB*/
const { App } = window.McpAppLib;
const VARIANT = "/*VARIANT*/";
const MODES = /*MODES*/;
const out = document.getElementById("out");
const t0 = performance.now();
const log = [];
const note = (what, x) => { log.push({ t: Math.round(performance.now() - t0), what, ...x }); out.textContent = JSON.stringify(log, null, 1); };
const app = new App({ name: "Endeavor panel probe", version: "0.0.1" }, MODES ? { availableDisplayModes: MODES } : {});
const ctx = () => { const c = app.getHostContext() || {}; return { mode: c.displayMode, avail: c.availableDisplayModes, size: c.containerDimensions, platform: c.platform }; };
app.addEventListener("hostcontextchanged", () => note("changed", ctx()));
await app.connect();
note("connected", ctx());
// a request with no click: the docs say Claude refuses it
if (VARIANT === "nopref") try { const r = await app.requestDisplayMode({ mode: "fullscreen" }); note("load-request", { got: r.mode }); } catch (e) { note("load-request-err", { e: String(e) }); }
document.getElementById("expand").addEventListener("click", async () => { const r = await app.requestDisplayMode({ mode: "fullscreen" }); note("click-request", { got: r.mode }); });
setTimeout(() => app.callServerTool({ name: "probe_report", arguments: { report: "panel " + VARIANT + " " + JSON.stringify(log) } }).catch(() => {}), 10000);
</script></body></html>
